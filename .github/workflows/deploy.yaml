name: Deploy to EC2

on:
  push:
    branches:
      - main


jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4


      - name: Set up SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ubuntu
          key: ${{ secrets.SSH_KEY }}
          script: |
            if [ -d /aws-instance ]; then
              cd /aws-instance
            elif [ -d "$HOME/aws-instance" ]; then
              cd "$HOME/aws-instance"
            else
              echo "Deploy directory not found: expected /aws-instance or $HOME/aws-instance"
              exit 1
            fi
            sudo docker compose down
            sudo docker compose up -d --build
            
