name: Deploy to EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Create application directory
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ubuntu
          key: ${{ secrets.SSH_KEY }}
          script: |
            mkdir -p /home/ubuntu/aws-instance
            sudo chown -R ubuntu:ubuntu /home/ubuntu/aws-instance
            sudo chmod u+rwx /home/ubuntu/aws-instance

      - name: Copy application to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ubuntu
          key: ${{ secrets.SSH_KEY }}
          source: "dockerfile,index.js,package.json,package-lock.json"
          target: "/home/ubuntu/aws-instance"
          overwrite: true

      - name: Build and run application
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ubuntu
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd /home/ubuntu/aws-instance
            sudo docker build -t aws-instance:latest -f dockerfile .
            sudo docker stop aws-instance || true
            sudo docker rm aws-instance || true
            sudo docker run -d --name aws-instance --restart unless-stopped -p 3000:3000 aws-instance:latest

